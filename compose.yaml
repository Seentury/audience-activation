services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: audience
      POSTGRES_PASSWORD: audience_dev_password
      POSTGRES_DB: audience_activation
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audience -d audience_activation"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: